services:
  web:
    build: ./fe
    # image: "yanivomc/fe-exam:latest"
    ports:
      - "5002:5002"
    
    networks:
      - internal

  backend-service:
    build: ./be
    # image: "yanivomc/be-exam:latest"
    networks:
      - internal
    environment:
      - MYSQL_HOST=mysqldb
      - MYSQL_USER=root
      - MYSQL_PASSWORD=123456
    depends_on:
      mysqldb:
        condition: service_healthy
    ports:
      - "5003:5001"


  mysqldb:
    image: mysql:8.0
    ports:
      - "3306:3306"
    networks:
      - internal
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      # create database name crypto_db
      MYSQL_DATABASE: crypto_db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=123456"]
      interval: 30s
      retries: 10
      start_period: 60s

networks:
  internal:
    driver: bridge


  