apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fe-be-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "github.com/AsuSociety/devopshift-welcome" # Replace with actual repo
    targetRevision: argocd-workshop
    path: welcome/exam/k8s-manifests # Path to your YAML files
  destination:
    server: "https://kubernetes.default.svc"
    namespace: fe-be-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
